name: GitHub Actions Demo
on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Triggered by event: ${{ github.event_name }}"
          echo "Branch name: ${{ github.ref }}"
      - uses: actions/checkout@v3.3.0
      - name: List files in repository
        run: |
          echo "The repository ${{ github.repository }} contains the following files:"
          tree
      - name: Test Log Levels
        run: |
          echo "::warning file=app.js,line=10::What have you done."
          echo "::error file=app.js,line=15,col=5::Shits fucked!"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Generate Value
        id: generator
        run: echo "build_id=12345" >> $GITHUB_OUTPUT
      - name: Use Value
        run: echo "The build ID is ${{ steps.generator.outputs.build_id }}"
    
    
